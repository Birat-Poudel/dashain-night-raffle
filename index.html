<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashain Night lucky draw: kites, marigolds and a Panche Baja spin to pick tonight's winners." />
    <title>Dashain Night Raffle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- shared paints for the marigolds, the countdown arc and the jamara -->
    <svg class="paints" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="mO" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#ffd98a" />
          <stop offset="0.45" stop-color="#ff9d1f" />
          <stop offset="1" stop-color="#d9520b" />
        </radialGradient>
        <radialGradient id="mY" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#fff6c2" />
          <stop offset="0.45" stop-color="#ffc928" />
          <stop offset="1" stop-color="#e09200" />
        </radialGradient>
        <radialGradient id="mGlow">
          <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95" />
          <stop offset="0.5" stop-color="#ffbe3c" stop-opacity="0.5" />
          <stop offset="1" stop-color="#ff9500" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="arcPaint" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff1b8" />
          <stop offset="0.5" stop-color="#ffb703" />
          <stop offset="1" stop-color="#ff6a00" />
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7cbf3a" />
          <stop offset="1" stop-color="#2f6b1a" />
        </linearGradient>
        <linearGradient id="jam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fbf6b8" />
          <stop offset="0.6" stop-color="#e3ea7a" />
          <stop offset="1" stop-color="#93b83a" />
        </linearGradient>
        <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c8643a" />
          <stop offset="1" stop-color="#6e2a14" />
        </linearGradient>
      </defs>
    </svg>

    <div class="sky" aria-hidden="true">
      <div class="stars" id="stars"></div>
      <div class="moon"></div>
      <div class="kites" id="kites"></div>
      <svg class="mountains" viewBox="0 0 1600 320" preserveAspectRatio="none">
        <path class="range-far" d="M0 320V196l90-38 70 22 90-64 70 40 80-58 70 44 90-82 80 70 80-30 80 50 80-80 80 50 80-34 80 54 80-48 90 58 80-44 80 54 80-40 70 30v124z" />
        <path class="snow" d="M535 82l25-22 27 24-12-3-15 9-14-8zM855 92l25-22 26 22-11-2-15 8-13-7zM378 116l22-21 22 21-10-2-12 7-11-6zM1018 105l22-20 22 20-10-2-12 6-11-5zM1178 110l22-20 22 20-10-2-12 6-11-5z" />
        <path class="range-near" d="M0 320V252q200-52 400-12t400-8 400 14 400-22v96z" />
      </svg>
    </div>

    <svg class="garland" id="garland" aria-hidden="true"></svg>
    <div class="jamara-corner jamara-left" aria-hidden="true"></div>
    <div class="jamara-corner jamara-right" aria-hidden="true"></div>

    <main class="stage">
      <header class="masthead">
        <p class="greeting" lang="ne">विजया दशमी २०८३ को हार्दिक मंगलमय शुभकामना</p>
        <h1><span class="t1">Dashain Night</span><span class="t2">Lucky Draw</span></h1>
        <div class="dhaka" aria-hidden="true"></div>
      </header>

      <section class="medallion-wrap" aria-label="Draw">
        <div class="medallion" id="medallion">
          <svg class="mala" id="mala" viewBox="-240 -240 480 480" aria-hidden="true"></svg>
          <div class="face">
            <p class="face-label" id="faceLabel">Winning Number</p>
            <div class="number" id="winnerDisplay"></div>
            <p class="number-ne" id="winnerNepali" lang="ne"></p>
          </div>
          <div class="countdown" id="countdown" aria-hidden="true"><span id="countdownValue">10</span></div>
        </div>
      </section>

      <div class="controls">
        <button id="drawButton" class="draw-button" type="button">Start Draw</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>
      <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      <ol class="winners" id="winnersList" aria-label="Winners so far"></ol>
    </main>

    <!-- raffle setup: a card over the page, so it never pushes the draw off screen -->
    <section class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <div class="settings-card">
        <h2 id="setupTitle">Raffle setup</h2>
        <div class="settings-grid">
          <label class="field">
            <span>First ticket</span>
            <input id="startNumber" type="number" inputmode="numeric" step="1" value="80100" />
          </label>
          <label class="field">
            <span>Last ticket</span>
            <input id="endNumber" type="number" inputmode="numeric" step="1" value="80300" />
          </label>
          <label class="field">
            <span>Spin time</span>
            <select id="spinTime">
              <option value="6">6 seconds</option>
              <option value="10" selected>10 seconds</option>
              <option value="15">15 seconds</option>
              <option value="20">20 seconds</option>
            </select>
          </label>
          <label class="field check">
            <input id="noRepeat" type="checkbox" checked />
            <span>Never draw the same ticket twice</span>
          </label>
        </div>
        <div class="settings-foot">
          <p class="hint">Space or Enter: start · S: setup · F: full screen · M: mute</p>
          <button id="hideSettings" class="hide-button" type="button">Done</button>
        </div>
      </div>
    </section>

    <div class="tools">
      <button id="soundButton" class="tool" type="button" aria-label="Mute music" aria-pressed="false" title="Mute (M)">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
      </button>
      <button id="fullscreenButton" class="tool" type="button" aria-label="Full screen" title="Full screen (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button id="settingsButton" class="tool" type="button" aria-label="Settings" aria-controls="settings" aria-expanded="true" title="Hide settings (S)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
      </button>
    </div>

    <div id="confettiLayer" aria-hidden="true"></div>

    <script src="audio-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
